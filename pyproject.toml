[project]
name = "voice-flow"
version = "1.0.0"
description = "Flow — Open-source multimodal information accessibility and transformation platform (Speech, Audio, Video)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pynput>=1.7.7",
    "pyperclip>=1.9.0",
    "pyautogui>=0.9.54",
    "pywebview>=4.4.1",
    "edge-tts>=7.0.0",
    "pypdf>=5.0.0",
    "pywinauto>=0.6.9",
    "comtypes>=1.4.0",
]

[project.scripts]
voice-flow = "voice_flow.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

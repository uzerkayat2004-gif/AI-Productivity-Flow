name: macOS e2e release test

# Installs the published macOS release on a GitHub-hosted Apple Silicon runner
# and exercises it the way a user would. This workflow does not modify the app.
# Product failures are recorded in the uploaded report; the job fails only when
# the harness itself could not install the DMG or reach a healthy backend.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to install"
        required: false
        default: v1.0.4
        type: string
  pull_request:
    paths:
      - .github/workflows/macos-e2e-release-test.yml

permissions:
  contents: read

concurrency:
  group: macos-e2e-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-e2e:
    name: Published macOS arm64 release
    runs-on: macos-14
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || 'v1.0.4' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Prepare output and show the runner
        run: |
          set -euo pipefail
          mkdir -p out/shots out/logs out/crash out/fixtures
          {
            echo "runner_arch=$(uname -m)"
            sw_vers
            echo "---- displays ----"
            system_profiler SPDisplaysDataType || true
            echo "---- chrome ----"
            ls -d "/Applications/Google Chrome.app" "$HOME/Applications/Google Chrome.app" 2>/dev/null || echo "Google Chrome.app not found"
          } | tee out/system.txt
          if [ "$(uname -m)" != "arm64" ]; then
            echo "HARNESS FAIL: this job must run on Apple Silicon (got $(uname -m))" | tee out/harness-error.txt
            exit 1
          fi

      - name: Download the published macOS assets
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          echo "Downloading ${RELEASE_TAG} from ${BASE}"
          assets=(
            AI-Productivity-Flow-macOS.dmg
            AI-Productivity-Flow-macOS.dmg.sha256
            AI-Productivity-Flow-macOS.zip
            AI-Productivity-Flow-macOS.zip.sha256
            AI-Productivity-Flow-app-update-mac.zip
            AI-Productivity-Flow-app-update-mac.zip.sha256
            AI-Productivity-Flow-app-update-mac.manifest.json
          )
          for name in "${assets[@]}"; do
            echo "GET $name"
            curl -fL --retry 5 --retry-delay 2 -o "$name" "$BASE/$name"
          done
          ls -lh "${assets[@]}" | tee out/download-ls.txt

      - name: SHA-check the DMG, zip, and app-update zip
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib, pathlib, sys
          def digest(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          def expected(path):
              token = pathlib.Path(path).read_text(encoding="utf-8").strip().split()
              if not token:
                  raise SystemExit(f"empty checksum file: {path}")
              return token[0].lower()
          rows = []
          failed = False
          for name in (
              "AI-Productivity-Flow-macOS.dmg",
              "AI-Productivity-Flow-macOS.zip",
              "AI-Productivity-Flow-app-update-mac.zip",
          ):
              got = digest(name)
              want = expected(name + ".sha256")
              ok = got == want
              failed = failed or not ok
              rows.append(f"{'PASS' if ok else 'FAIL'} {name}\n  actual   {got}\n  expected {want}")
          text = "\n".join(rows) + "\n"
          pathlib.Path("out/sha256.txt").write_text(text, encoding="utf-8")
          print(text)
          if failed:
              sys.exit(1)
          PY

      - name: Mount the DMG, install the app, and strip quarantine
        id: install
        run: |
          set -euo pipefail
          MOUNT="/Volumes/APF-e2e"
          hdiutil detach "$MOUNT" >/dev/null 2>&1 || true
          hdiutil attach AI-Productivity-Flow-macOS.dmg -nobrowse -readonly -mountpoint "$MOUNT" | tee out/mount.txt
          APP_SRC=$(find "$MOUNT" -maxdepth 3 -name "*.app" -print -quit)
          if [ -z "${APP_SRC:-}" ]; then
            echo "HARNESS FAIL: no .app inside the DMG" | tee out/harness-error.txt
            exit 1
          fi
          echo "Found $APP_SRC" | tee -a out/mount.txt
          DEST="/Applications"
          if [ ! -w "$DEST" ]; then
            DEST="$HOME/Applications"
            mkdir -p "$DEST"
          fi
          NAME=$(basename "$APP_SRC")
          rm -rf "$DEST/$NAME"
          ditto "$APP_SRC" "$DEST/$NAME"
          xattr -dr com.apple.quarantine "$DEST/$NAME" || true
          hdiutil detach "$MOUNT" || true
          echo "APP_PATH=$DEST/$NAME" >> "$GITHUB_ENV"
          echo "$DEST/$NAME" > out/app-path.txt
          {
            echo "installed=$DEST/$NAME"
            echo "---- quarantine ----"
            xattr -l "$DEST/$NAME" || true
            echo "---- codesign ----"
            codesign -dv --verbose=2 "$DEST/$NAME" 2>&1 || true
            echo "---- spctl ----"
            spctl -a -vv "$DEST/$NAME" 2>&1 || true
            EXE=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$DEST/$NAME/Contents/Info.plist")
            echo "executable=$EXE"
            file "$DEST/$NAME/Contents/MacOS/$EXE" || true
            lipo -archs "$DEST/$NAME/Contents/MacOS/$EXE" 2>&1 || true
            echo "---- info plist version ----"
            /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$DEST/$NAME/Contents/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$DEST/$NAME/Contents/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print LSMinimumSystemVersion" "$DEST/$NAME/Contents/Info.plist" || true
          } | tee out/install.txt
          if xattr -l "$DEST/$NAME" 2>/dev/null | grep -q "com.apple.quarantine"; then
            echo "FAIL quarantine still present" | tee out/quarantine.txt
            exit 1
          fi
          echo "PASS quarantine attribute removed" | tee out/quarantine.txt

      - name: Set up the screenshot driver
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install chromium

      - name: Write the end-to-end driver
        run: |
          cat > "$RUNNER_TEMP/macos_e2e.py" << 'PY'
          """Drive the installed AI Productivity Flow macOS build. No app files are modified."""
          from __future__ import annotations

          import json
          import os
          import signal
          import subprocess
          import sys
          import time
          import traceback
          import urllib.error
          import urllib.request
          import wave
          from pathlib import Path

          OUT = Path("out").resolve()
          SHOTS = OUT / "shots"
          SHOTS.mkdir(parents=True, exist_ok=True)
          BASE = "http://127.0.0.1:8991"
          NOTES: list[str] = []
          STEPS: list[dict] = []
          N = 0


          def save_steps() -> None:
              (OUT / "steps.json").write_text(json.dumps(STEPS, indent=2), encoding="utf-8")
              (OUT / "screenshot-notes.md").write_text(
                  "# Screenshot notes\n\n" + "\n".join(f"- {line}" for line in NOTES) + "\n",
                  encoding="utf-8",
              )


          def record(step: str, status: str, detail: str = "", **extra) -> None:
              row = {"step": step, "status": status, "detail": str(detail)[:2000], **extra}
              STEPS.append(row)
              save_steps()
              print(f"[{status.upper():>4}] {step}: {row['detail']}", flush=True)


          def next_name(slug: str) -> str:
              global N
              N += 1
              safe = "".join(ch if ch.isalnum() or ch in "-_" else "-" for ch in slug)[:70].strip("-")
              return f"{N:03d}-{safe}.png"


          def native_capture(slug: str, note: str) -> str:
              name = next_name(slug)
              path = SHOTS / name
              proc = subprocess.run(["screencapture", "-x", str(path)], capture_output=True, text=True)
              size = path.stat().st_size if path.is_file() else 0
              status = "pass" if proc.returncode == 0 and size > 1000 else "fail"
              detail = f"exit={proc.returncode} bytes={size} stderr={proc.stderr.strip()[:300]}"
              NOTES.append(f"{name}: {note} ({detail})")
              record(f"screencapture {slug}", status, detail, shot=name)
              return name


          def window_list() -> list[dict]:
              helper = OUT / "window-list"
              if not helper.is_file():
                  return []
              try:
                  raw = subprocess.run([str(helper), "windows"], capture_output=True, text=True, timeout=15).stdout
                  data = json.loads(raw or "[]")
                  return data if isinstance(data, list) else []
              except Exception as exc:
                  return [{"error": repr(exc)}]


          def api(path: str, body: dict | None = None, timeout: float = 20.0):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  method="GET" if body is None else "POST",
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      raw = resp.read()
                      try:
                          return resp.status, json.loads(raw.decode("utf-8", "replace"))
                      except Exception:
                          return resp.status, raw[:500].decode("utf-8", "replace")
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      parsed = json.loads(raw.decode("utf-8", "replace"))
                  except Exception:
                      parsed = raw[:500].decode("utf-8", "replace")
                  return exc.code, parsed
              except Exception as exc:
                  return None, repr(exc)


          def listener_pids() -> list[int]:
              proc = subprocess.run(["lsof", "-nP", "-iTCP:8991", "-sTCP:LISTEN", "-t"], capture_output=True, text=True)
              pids = []
              for line in proc.stdout.split():
                  if line.strip().isdigit():
                      pids.append(int(line.strip()))
              return sorted(set(pids))


          def app_processes(app_path: str) -> str:
              proc = subprocess.run(["ps", "-ax", "-o", "pid=,ppid=,command="], capture_output=True, text=True)
              lines = [line.rstrip() for line in proc.stdout.splitlines() if "Productivity" in line or "voice_flow" in line or app_path in line]
              return "\n".join(lines[:40])


          def compile_window_helper() -> None:
              source = OUT / "window-list.swift"
              source.write_text(
                  """
          import CoreGraphics
          import Foundation
          let list = (CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]]) ?? []
          var rows: [[String: Any]] = []
          for w in list {
            let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
            rows.append([
              "owner": w[kCGWindowOwnerName as String] as? String ?? "",
              "pid": (w[kCGWindowOwnerPID as String] as? NSNumber)?.intValue ?? 0,
              "name": w[kCGWindowName as String] as? String ?? "",
              "id": (w[kCGWindowNumber as String] as? NSNumber)?.intValue ?? 0,
              "layer": (w[kCGWindowLayer as String] as? NSNumber)?.intValue ?? 0,
              "w": (b["Width"] as? NSNumber)?.doubleValue ?? 0,
              "h": (b["Height"] as? NSNumber)?.doubleValue ?? 0,
            ])
          }
          let data = try! JSONSerialization.data(withJSONObject: rows)
          FileHandle.standardOutput.write(data)
          """,
                  encoding="utf-8",
              )
              proc = subprocess.run(["swiftc", str(source), "-o", str(OUT / "window-list")], capture_output=True, text=True)
              record("compile window helper", "pass" if proc.returncode == 0 else "fail", (proc.stderr or proc.stdout)[:500])


          def wait_health(seconds: int = 120) -> tuple[bool, float | None]:
              start = time.time()
              deadline = start + seconds
              while time.time() < deadline:
                  code, _body = api("/api/runtime", timeout=2)
                  if code == 200:
                      return True, time.time() - start
                  time.sleep(1)
              return False, None


          def main_window_seen() -> bool:
              for row in window_list():
                  owner = str(row.get("owner", ""))
                  name = str(row.get("name", ""))
                  if "Productivity" in owner or "Productivity" in name or "voice" in owner.lower():
                      if float(row.get("w") or 0) > 200 and float(row.get("h") or 0) > 200:
                          return True
              return False


          def phase_launch(app_path: str) -> int | None:
              native_capture("desktop-before-launch", "Desktop before the app is opened.")
              started = time.time()
              subprocess.run(["open", app_path], check=False)
              health_ok = False
              health_s = None
              window_s = None
              deadline = time.time() + 90
              while time.time() < deadline:
                  if health_s is None:
                      code, _body = api("/api/runtime", timeout=2)
                      if code == 200:
                          health_s = time.time() - started
                          health_ok = True
                  if window_s is None and main_window_seen():
                      window_s = time.time() - started
                  if health_ok and window_s is not None:
                      break
                  time.sleep(1)
              if not health_ok:
                  exe = subprocess.run(
                      ["/usr/libexec/PlistBuddy", "-c", "Print CFBundleExecutable", f"{app_path}/Contents/Info.plist"],
                      capture_output=True, text=True,
                  ).stdout.strip()
                  record("open(1) reached backend", "fail", "no /api/runtime within 90s; launching the executable directly")
                  log = open(OUT / "app-stdout.txt", "w", encoding="utf-8")
                  subprocess.Popen(
                      [f"{app_path}/Contents/MacOS/{exe}"],
                      stdout=log, stderr=subprocess.STDOUT, start_new_session=True,
                  )
                  health_ok, health_s = wait_health(90)
                  if main_window_seen():
                      window_s = health_s
              pids = listener_pids()
              record(
                  "time to backend health",
                  "pass" if health_ok else "fail",
                  f"seconds={health_s}",
                  seconds=health_s,
              )
              record(
                  "time to main window",
                  "pass" if window_s is not None else "fail",
                  f"seconds={window_s} windows={json.dumps(window_list())[:800]}",
                  seconds=window_s,
              )
              native_capture("native-after-launch", "Native screen after launch, before any page driving.")
              time.sleep(8)
              code, body = api("/api/runtime", timeout=5)
              alive = bool(pids) and all(_pid_alive(pid) for pid in pids)
              record(
                  "app stays up and answers a second health check",
                  "pass" if code == 200 and alive else "fail",
                  f"http={code} listener_pids={pids} body={json.dumps(body, default=str)[:400]}",
              )
              (OUT / "launch-timing.json").write_text(json.dumps({
                  "health_seconds": health_s,
                  "window_seconds": window_s,
                  "listener_pids": pids,
              }, indent=2), encoding="utf-8")
              return pids[0] if pids else None


          def _pid_alive(pid: int) -> bool:
              try:
                  os.kill(pid, 0)
                  return True
              except OSError:
                  return False


          def phase_single_instance(app_path: str, listener: int | None) -> None:
              before = listener_pids()
              before_ps = app_processes(app_path)
              subprocess.run(["open", app_path], check=False)
              time.sleep(8)
              after = listener_pids()
              after_ps = app_processes(app_path)
              (OUT / "processes-before-second-open.txt").write_text(before_ps + "\n", encoding="utf-8")
              (OUT / "processes-after-second-open.txt").write_text(after_ps + "\n", encoding="utf-8")
              one_listener = len(after) == 1 and (listener is None or after == [listener] or after == before)
              record(
                  "second open keeps a single backend instance",
                  "pass" if one_listener else "fail",
                  f"before={before} after={after}",
              )
              code, _body = api("/api/runtime", timeout=5)
              record(
                  "backend still healthy after second open",
                  "pass" if code == 200 else "fail",
                  f"http={code}",
              )


          def phase_updater_api() -> None:
              code, body = api("/api/updates/check?force=1", timeout=30)
              (OUT / "updates-check.json").write_text(json.dumps(body, indent=2, default=str), encoding="utf-8")
              current = ""
              latest = ""
              available = None
              if isinstance(body, dict):
                  current = str(body.get("current_version") or "")
                  latest = str(body.get("latest_version") or "")
                  available = body.get("update_available")
              up_to_date = current == "1.0.4" and available is False and latest.split("-")[0] == "1.0.4"
              record(
                  "updater reports v1.0.4 is up to date",
                  "pass" if code == 200 and up_to_date else "fail",
                  f"http={code} current={current} latest={latest} update_available={available}",
              )
              code_v, version_body = api("/api/version", timeout=15)
              (OUT / "api-version.json").write_text(json.dumps(version_body, indent=2, default=str), encoding="utf-8")
              record("GET /api/version", "pass" if code_v == 200 else "fail", json.dumps(version_body, default=str)[:500])


          def shot(page, slug: str, note: str, full: bool = False) -> None:
              name = next_name(slug)
              try:
                  page.screenshot(path=str(SHOTS / name), full_page=full)
                  NOTES.append(f"{name}: {note}")
                  record(f"screenshot {slug}", "pass", note, shot=name)
              except Exception as exc:
                  NOTES.append(f"{name}: FAILED {note} ({exc})")
                  record(f"screenshot {slug}", "fail", f"{note} {exc}")


          def js(page, script: str, arg=None):
              try:
                  if arg is None:
                      return page.evaluate(script)
                  return page.evaluate(script, arg)
              except Exception as exc:
                  return {"__error": str(exc).splitlines()[-1][:400]}


          def phase_pages() -> None:
              from playwright.sync_api import sync_playwright

              native_capture("native-before-pages", "Native screen while the real app window is up, before the headless page tour.")
              with sync_playwright() as pw:
                  browser = pw.chromium.launch(headless=True)
                  page = browser.new_page(viewport={"width": 1440, "height": 900}, device_scale_factor=1)
                  page.goto(BASE + "/index.html", wait_until="load", timeout=60000)
                  page.wait_for_timeout(4000)
                  record("app UI loaded from its own URL", "pass", page.title())

                  js(page, "() => { try { stopOnboardingNarration(); } catch (e) {} }")
                  for i in range(5):
                      js(page, "(i) => { if (typeof replayOnboarding === 'function' && i === 0) replayOnboarding(); if (typeof gotoOnboardingSlide === 'function') gotoOnboardingSlide(i); }", i)
                      page.wait_for_timeout(1200)
                      js(page, "() => { try { stopOnboardingNarration(); } catch (e) {} }")
                      text = js(page, "() => (document.getElementById('onboarding-overlay') || document.body).innerText.slice(0, 500)")
                      note = f"Onboarding tour scene {i + 1}."
                      if i == 1:
                          mac = isinstance(text, str) and "coming to Mac" in text
                          record("onboarding scene 2 says Video Flow is coming to Mac", "pass" if mac else "fail", str(text)[:300])
                          note += " Scene 2 should say Video Flow is coming to Mac."
                      shot(page, f"onboarding-scene-{i + 1}", note)
                      if i == 0:
                          subprocess.run(["open", os.environ.get("APP_PATH", "")], check=False)
                          native_capture("native-onboarding", "Native screen during first launch. The real window is usually still on the welcome tour because hosted runners often refuse assistive clicks.")

                  js(page, """() => {
                    try { finishOnboarding({skipped: true}); } catch (e) {}
                    try { stopAudioFlowGuide(true); } catch (e) {}
                    try { stopVoiceFlowGuide(true); } catch (e) {}
                    try { stopVideoFlowGuide(true); } catch (e) {}
                  }""")
                  page.wait_for_timeout(600)

                  guide_plan = [
                      ("audio", "startAudioFlowGuide", "gotoAudioFlowGuideStep", 4, "Audio Flow feature guide"),
                      ("voice", "startVoiceFlowGuide", "gotoVoiceFlowGuideStep", 4, "Voice Flow feature guide"),
                  ]
                  for slug, start, goto, count, label in guide_plan:
                      started = js(page, f"() => {{ if (typeof {start} === 'function') {{ {start}(); return 'started'; }} return 'missing'; }}")
                      record(f"{label} start", "pass" if started == "started" else "fail", str(started))
                      for step in range(1, count + 1):
                          js(page, f"(n) => {{ if (typeof {goto} === 'function') {goto}(n); }}", step)
                          page.wait_for_timeout(700)
                          js(page, "() => { try { stopAudioFlowGuideAudio && stopAudioFlowGuideAudio(); } catch (e) {} try { stopVoiceFlowGuideAudio && stopVoiceFlowGuideAudio(); } catch (e) {} }")
                          title = js(page, """() => {
                            const ids = ['af-guide-title','voiceflow-guide-title','vf-guide-title'];
                            for (const id of ids) { const el = document.getElementById(id); if (el && el.innerText.trim()) return el.innerText.trim(); }
                            const card = document.querySelector('#audioflow-guide-overlay:not(.hidden), #voiceflow-guide-overlay:not(.hidden)');
                            return card ? card.innerText.slice(0, 180) : '';
                          }""")
                          shot(page, f"guide-{slug}-step-{step}", f"{label} step {step} of {count}. {title}")
                      stop_call = "stopAudioFlowGuide(true)" if slug == "audio" else "stopVoiceFlowGuide(true)"
                      js(page, "() => { try { " + stop_call + "; } catch (e) {} }")

                  video_start = js(page, """() => {
                    if (typeof switchPage === 'function') switchPage('videoflow');
                    if (typeof vfApplyMacVideoFlowGate === 'function') vfApplyMacVideoFlowGate();
                    const before = document.getElementById('videoflow-guide-overlay');
                    const wasHidden = !before || before.classList.contains('hidden');
                    if (typeof startVideoFlowGuide === 'function') startVideoFlowGuide();
                    const overlay = document.getElementById('videoflow-guide-overlay');
                    const guideOpen = !!overlay && !overlay.classList.contains('hidden');
                    const text = (document.getElementById('page-videoflow') || document.body).innerText;
                    return {wasHidden, guideOpen, coming: text.includes('coming to Mac'), text: text.slice(0, 400)};
                  }""")
                  (OUT / "video-guide-result.json").write_text(json.dumps(video_start, indent=2, default=str), encoding="utf-8")
                  coming = isinstance(video_start, dict) and video_start.get("coming") is True
                  guide_blocked = isinstance(video_start, dict) and video_start.get("guideOpen") is False
                  record("Video Flow page says coming to Mac", "pass" if coming else "fail", json.dumps(video_start, default=str)[:500])
                  record("Video Flow feature guide does not open on Mac", "pass" if guide_blocked else "fail", json.dumps(video_start, default=str)[:500])
                  shot(page, "video-flow-coming-to-mac", "Video Flow page on Mac, including the coming-to-Mac note. The feature guide stays closed.")

                  pages = [
                      ("home", "Home"),
                      ("insights", "Insights"),
                      ("dictionary", "Dictionary"),
                      ("style", "Style"),
                      ("providers", "Voice Flow"),
                      ("audioflow", "Audio Flow"),
                      ("videoflow", "Video Flow"),
                  ]
                  for theme in ("light", "dark"):
                      js(page, """(theme) => {
                        if (typeof paintTheme === 'function') paintTheme(theme);
                        else document.documentElement.setAttribute('data-theme', theme);
                        try { finishOnboarding({skipped:true}); } catch (e) {}
                        try { stopAudioFlowGuide(true); } catch (e) {}
                        try { stopVoiceFlowGuide(true); } catch (e) {}
                        try { stopVideoFlowGuide(true); } catch (e) {}
                        try { closeSettings(); } catch (e) {}
                      }""", theme)
                      page.wait_for_timeout(400)
                      for pid, label in pages:
                          js(page, "(pid) => { if (typeof switchPage === 'function') switchPage(pid); }", pid)
                          page.wait_for_timeout(500)
                          shot(page, f"page-{pid}-{theme}", f"{label} page in {theme} mode, served by the installed app.")
                      for tab, label in (("general", "General"), ("system", "System"), ("account", "Account")):
                          js(page, "(tab) => { if (typeof openSettings === 'function') openSettings(tab); }", tab)
                          page.wait_for_timeout(500)
                          shot(page, f"settings-{tab}-{theme}", f"Settings, {label} tab, {theme} mode.")
                          if tab == "system":
                              js(page, """() => {
                                const titles = [...document.querySelectorAll('.preference-section-title')];
                                const about = titles.find(t => /About/.test(t.textContent || ''));
                                if (about) about.scrollIntoView({block: 'start'});
                              }""")
                              page.wait_for_timeout(300)
                              about = js(page, """() => ({

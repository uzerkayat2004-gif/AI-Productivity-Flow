[project]
name = "voice-flow"
version = "1.0.0"
description = "Wispr Flow-like voice dictation for Windows — press a button, speak, text appears"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "pynput>=1.7.7",
    "pyperclip>=1.9.0",
    "pyautogui>=0.9.54",
]

[project.scripts]
voice-flow = "voice_flow.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_flow"]

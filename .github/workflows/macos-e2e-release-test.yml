                              shot(page, f"settings-about-updates-{theme}", f"Settings system tab scrolled to About & Updates, {theme} mode. Badge text: {about}")
                              js(page, """() => { const row = document.getElementById('privacy-crash-row'); if (row) row.scrollIntoView({block: 'center'}); }""")
                              page.wait_for_timeout(200)
                              shot(page, f"settings-privacy-{theme}", f"Settings Privacy row (crash reports) in {theme} mode.")
                      js(page, "() => { try { closeSettings(); } catch (e) {} }")
                      js(page, """() => {
                        if (typeof switchPage === 'function') switchPage('providers');
